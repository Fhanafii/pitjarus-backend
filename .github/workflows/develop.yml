name: Development CI

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  ci:

    runs-on: ubuntu-latest

    steps:

      # ==========================
      # Checkout Repository
      # ==========================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================
      # Setup Node
      # ==========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ==========================
      # Install Dependency
      # ==========================
      - name: Install Dependencies
        run: npm ci

      # ==========================
      # Prisma Generate
      # ==========================
      - name: Generate Prisma Client
        run: npx prisma generate

      # ==========================
      # TypeScript Build
      # ==========================
      - name: Build Project
        run: npm run build

      # ==========================
      # Docker Build Validation
      # ==========================
      - name: Build Docker Image
        run: |
          docker build \
            -t pitjarus-backend:ci \
            .